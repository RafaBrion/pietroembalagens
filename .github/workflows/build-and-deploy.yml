name: Build and deploy

on:
  push:
    branches:
      - master
    paths:
      - 'content/**'
      - 'template/**'
      - 'package-lock.json'
      - '.ecomplus.cd.json'
      - '.functions/**'
      - 'firebase.json'
      - '.github/build-and-deploy'
      - '.github/workflows/build-and-deploy.yml'
      - '.github/scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: firebase-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Storefront and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.head_commit.message != 'Initial commit' &&
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Configure build evidence directory
        run: echo "DEPLOY_EVIDENCE_DIR=$RUNNER_TEMP/pietro-build-evidence" >> "$GITHUB_ENV"

      - name: Verify approved source
        run: node .github/scripts/verify-deploy.cjs source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci --only=production

      - name: Setup functions Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install functions dependencies
        run: |
          node -e 'if (process.versions.node.split(".")[0] !== "22") process.exit(1); console.log("Functions install:", process.version)'
          cd .functions && npm ci --only=production

      - name: Verify functions runtime and HTTP safeguards
        run: |
          node .github/scripts/verify-functions-runtime.cjs
          node --test tests/ssr-compression.test.cjs tests/functions-runtime.test.cjs

      - name: Verify source after installation
        run: node .github/scripts/verify-deploy.cjs source

      - name: Setup frontend build Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Test storefront safeguards
        run: node --test tests/*.test.cjs

      - name: Check last changed files
        uses: lots0logs/gh-action-get-changed-files@2.1.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        id: changed_files

      - name: Run partial build
        env:
          CHANGED_FILES: ${{ steps.changed_files.outputs.all }}
        run: node .github/scripts/build-storefront.cjs
        id: build

      - name: Verify source after build or purge
        run: node .github/scripts/verify-deploy.cjs source

      - name: Verify build and prepare SSR evidence
        if: steps.build.outputs.mode == 'build'
        run: node .github/scripts/verify-deploy.cjs evidence

      - name: Preserve prepared build evidence
        if: steps.build.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: prepared-build-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEPLOY_EVIDENCE_DIR }}/deployment.json
            ${{ env.DEPLOY_EVIDENCE_DIR }}/hosting-build.tar.gz
            ${{ env.DEPLOY_EVIDENCE_DIR }}/ssr-source.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Setup deployment Node
        if: steps.build.outputs.mode == 'build'
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify deployment runtime
        if: steps.build.outputs.mode == 'build'
        run: node .github/scripts/verify-functions-runtime.cjs

      - name: Capture production baseline
        if: steps.build.outputs.mode == 'build'
        env:
          GCP_ACCOUNT_KEY: ${{ secrets.GCP_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/pietro-firebase-baseline.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$GCP_ACCOUNT_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          PROJECT_ID=$(node -e 'let project; try { project = JSON.parse(process.env.GCP_ACCOUNT_KEY).project_id } catch {} if (typeof project !== "string" || !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(project)) { console.error("Invalid Firebase project configuration"); process.exit(1) } process.stdout.write(project)')
          node .github/scripts/capture-deployment.cjs "$PROJECT_ID" before

      - name: Preserve baseline before changing production
        if: steps.build.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: production-baseline-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.DEPLOY_EVIDENCE_DIR }}/production-before.json
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Firebase
        if: steps.build.outputs.mode == 'build'
        env:
          GCP_ACCOUNT_KEY: ${{ secrets.GCP_ACCOUNT_KEY }}
        run: |
          set -euo pipefail
          node .github/scripts/verify-functions-runtime.cjs
          node .github/scripts/verify-deploy.cjs source
          node .github/scripts/verify-deploy.cjs artifacts
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/pietro-firebase-adminsdk.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$GCP_ACCOUNT_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          PROJECT_ID=$(node -e 'let project; try { project = JSON.parse(process.env.GCP_ACCOUNT_KEY).project_id } catch {} if (typeof project !== "string" || !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(project)) { console.error("Invalid Firebase project configuration"); process.exit(1) } process.stdout.write(project)')
          node node_modules/firebase-tools/lib/bin/firebase.js deploy --project="$PROJECT_ID" --non-interactive
          node .github/scripts/capture-deployment.cjs "$PROJECT_ID" after
          node .github/scripts/verify-functions-runtime.cjs --deployed "$DEPLOY_EVIDENCE_DIR/production-after.json"

      - name: Preserve production resource identifiers
        if: always() && steps.build.outputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: production-resources-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.DEPLOY_EVIDENCE_DIR }}/production-before.json
            ${{ env.DEPLOY_EVIDENCE_DIR }}/production-after.json
          if-no-files-found: warn
          retention-days: 14
